name: Build AutoNAV Installer

# Builds AutoNAV.dll for every supported Navisworks year (2024-2027) against
# the matching Speckle.Navisworks.API NuGet package, stages each into the
# AutoNAV.bundle, then cross-compiles AutoNAV-Installer.exe with all four DLLs
# embedded. The final .exe is uploaded as a workflow artifact (and attached to
# any GitHub Release when the workflow runs on a tag).

on:
  push:
    branches: [main, "claude/**", "feature/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # for release attachment

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - nw_year: "2024"
            speckle_version: "2024.0.0"
            bundle_subdir: "V24"
          - nw_year: "2025"
            speckle_version: "2025.0.0"
            bundle_subdir: "V25"
          - nw_year: "2026"
            speckle_version: "2026.0.1"
            bundle_subdir: "V26"
          - nw_year: "2027"
            speckle_version: "2027.0.0"
            bundle_subdir: "V27"

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build AutoNAV.dll for Navisworks ${{ matrix.nw_year }}
        run: |
          dotnet build AutoNAV/AutoNAV.CI.csproj \
            -c Release \
            -p:Platform=x64 \
            -p:NWYear=${{ matrix.nw_year }} \
            -p:NWPackageVersion=${{ matrix.speckle_version }} \
            -v:minimal -nologo

      - name: Verify the DLL was produced
        run: |
          out="AutoNAV/bin/x64/Release/net48/AutoNAV.dll"
          test -f "$out" || { echo "Missing $out"; exit 1; }
          file "$out"
          echo "Size: $(stat -c%s "$out") bytes"

      - name: Upload per-version DLL
        uses: actions/upload-artifact@v4
        with:
          name: AutoNAV-${{ matrix.bundle_subdir }}
          path: AutoNAV/bin/x64/Release/net48/AutoNAV.dll
          if-no-files-found: error
          retention-days: 7

  package:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Download all per-version DLLs
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage DLLs into the bundle
        run: |
          set -euo pipefail
          for sub in V24 V25 V26 V27; do
            mkdir -p "Installer/payload/AutoNAV.bundle/Contents/$sub"
            cp "artifacts/AutoNAV-$sub/AutoNAV.dll" "Installer/payload/AutoNAV.bundle/Contents/$sub/AutoNAV.dll"
            cp AutoNAV/AutoNAV.addin "Installer/payload/AutoNAV.bundle/Contents/$sub/AutoNAV.addin"
            echo "  staged $sub: $(md5sum Installer/payload/AutoNAV.bundle/Contents/$sub/AutoNAV.dll)"
          done
          ls -laR Installer/payload/AutoNAV.bundle

      - name: Cross-compile AutoNAV-Installer.exe
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          cd Installer
          go build -ldflags='-s -w' -o ../Distributable/AutoNAV-Installer.exe .
          ls -la ../Distributable/AutoNAV-Installer.exe
          file ../Distributable/AutoNAV-Installer.exe

      - name: Upload installer .exe
        uses: actions/upload-artifact@v4
        with:
          name: AutoNAV-Installer
          path: Distributable/AutoNAV-Installer.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload the staged bundle (for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: AutoNAV.bundle
          path: Installer/payload/AutoNAV.bundle
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Distributable/AutoNAV-Installer.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
