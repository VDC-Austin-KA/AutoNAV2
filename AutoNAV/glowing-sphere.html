<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Glowing Sphere</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        canvas {
            display: block;
        }

        .info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 14px;
            opacity: 0.7;
            text-align: center;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        .title {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.8), 0 0 40px rgba(0, 255, 255, 0.4);
        }
    </style>
</head>
<body>
    <div class="title">Glowing Sphere</div>
    <div class="info">Move your mouse to interact</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        
        // Camera
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 3;

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Sphere geometry with high detail
        const sphereGeometry = new THREE.SphereGeometry(1, 64, 64);

        // Custom shader material for glowing effect
        const sphereMaterial = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                mouseX: { value: 0 },
                mouseY: { value: 0 },
                glowColor: { value: new THREE.Color(0x00ffff) },
                baseColor: { value: new THREE.Color(0x0066ff) }
            },
            vertexShader: `
                varying vec3 vNormal;
                varying vec3 vPosition;
                uniform float time;
                uniform float mouseX;
                uniform float mouseY;
                
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    vPosition = position;
                    
                    // Subtle vertex displacement based on time and mouse
                    vec3 newPosition = position;
                    newPosition += normal * sin(time * 2.0 + position.y * 3.0) * 0.02;
                    
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
                }
            `,
            fragmentShader: `
                uniform float time;
                uniform float mouseX;
                uniform float mouseY;
                uniform vec3 glowColor;
                uniform vec3 baseColor;
                varying vec3 vNormal;
                varying vec3 vPosition;
                
                void main() {
                    // Fresnel effect for edge glow
                    vec3 viewDirection = normalize(cameraPosition - vPosition);
                    float fresnel = pow(1.0 - abs(dot(vNormal, viewDirection)), 2.0);
                    
                    // Dynamic color based on mouse position
                    vec3 dynamicColor = mix(baseColor, glowColor, (mouseX + 1.0) * 0.5);
                    
                    // Pulsating glow
                    float pulse = sin(time * 3.0) * 0.3 + 0.7;
                    
                    // Combine effects
                    vec3 finalColor = dynamicColor * 0.6;
                    finalColor += glowColor * fresnel * 2.0 * pulse;
                    finalColor += vec3(1.0) * pow(fresnel, 4.0) * 0.5;
                    
                    gl_FragColor = vec4(finalColor, 1.0);
                }
            `,
            transparent: true
        });

        const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
        scene.add(sphere);

        // Inner glow sphere
        const innerGlowGeometry = new THREE.SphereGeometry(0.85, 32, 32);
        const innerGlowMaterial = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                glowColor: { value: new THREE.Color(0x00ffff) }
            },
            vertexShader: `
                varying vec3 vNormal;
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float time;
                uniform vec3 glowColor;
                varying vec3 vNormal;
                
                void main() {
                    float intensity = pow(0.7 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.0);
                    float pulse = sin(time * 2.0) * 0.2 + 0.8;
                    vec3 glow = glowColor * intensity * pulse;
                    gl_FragColor = vec4(glow, intensity * 0.8);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            side: THREE.BackSide
        });

        const innerGlow = new THREE.Mesh(innerGlowGeometry, innerGlowMaterial);
        scene.add(innerGlow);

        // Outer glow particles
        const particlesGeometry = new THREE.BufferGeometry();
        const particleCount = 200;
        const positions = new Float32Array(particleCount * 3);
        
        for (let i = 0; i < particleCount * 3; i += 3) {
            const radius = 1.5 + Math.random() * 1.5;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            
            positions[i] = radius * Math.sin(phi) * Math.cos(theta);
            positions[i + 1] = radius * Math.sin(phi) * Math.sin(theta);
            positions[i + 2] = radius * Math.cos(phi);
        }
        
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        
        const particlesMaterial = new THREE.PointsMaterial({
            color: 0x00ffff,
            size: 0.03,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending
        });
        
        const particles = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particles);

        // Mouse tracking
        let mouseX = 0;
        let mouseY = 0;
        let targetRotationX = 0;
        let targetRotationY = 0;

        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
        });

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation loop
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            
            const elapsedTime = clock.getElapsedTime();
            
            // Update shader uniforms
            sphereMaterial.uniforms.time.value = elapsedTime;
            sphereMaterial.uniforms.mouseX.value = mouseX;
            sphereMaterial.uniforms.mouseY.value = mouseY;
            innerGlowMaterial.uniforms.time.value = elapsedTime;
            
            // Smooth mouse-following rotation
            targetRotationX = mouseY * 0.5;
            targetRotationY = mouseX * 0.5;
            
            // Auto-rotation + mouse influence
            sphere.rotation.x += 0.005 + (targetRotationX - sphere.rotation.x) * 0.05;
            sphere.rotation.y += 0.008 + (targetRotationY - sphere.rotation.y) * 0.05;
            
            innerGlow.rotation.x = sphere.rotation.x;
            innerGlow.rotation.y = sphere.rotation.y;
            
            // Rotate particles
            particles.rotation.y += 0.001;
            particles.rotation.x += 0.0005;
            
            // Animate particle positions
            const positionAttribute = particlesGeometry.getAttribute('position');
            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                const x = positionAttribute.array[i3];
                const y = positionAttribute.array[i3 + 1];
                const z = positionAttribute.array[i3 + 2];
                
                // Gentle floating motion
                positionAttribute.array[i3] = x + Math.sin(elapsedTime + i) * 0.001;
                positionAttribute.array[i3 + 1] = y + Math.cos(elapsedTime + i) * 0.001;
                positionAttribute.array[i3 + 2] = z + Math.sin(elapsedTime + i * 0.5) * 0.001;
            }
            positionAttribute.needsUpdate = true;
            
            // Camera subtle movement based on mouse
            camera.position.x += (mouseX * 0.5 - camera.position.x) * 0.05;
            camera.position.y += (mouseY * 0.3 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);
            
            renderer.render(scene, camera);
        }
        
        animate();
    </script>
</body>
</html>
